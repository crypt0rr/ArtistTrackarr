{{template "head" .}}
<section class="page-head"><p class="eyebrow">Bulk tools</p><h1>Import artists</h1>
<p>Paste one value per line or upload a CSV whose first column contains artist names, MusicBrainz IDs/URLs, or Spotify artist URLs. Imports are capped at 100 rows.</p></section>
<section class="panel narrow">
<form method="post" action="/imports" enctype="multipart/form-data" class="stack">
  {{template "csrf" .}}
  <label>Artist list<textarea name="artists" rows="12" placeholder="Björk&#10;https://musicbrainz.org/artist/...&#10;https://open.spotify.com/artist/..."></textarea></label>
  <div class="divider">or</div>
  <label>CSV file<input type="file" name="file" accept=".csv,text/csv"></label>
  <button>Review and import</button>
</form></section>
{{template "foot" .}}
