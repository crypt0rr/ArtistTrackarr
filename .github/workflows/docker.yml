name: Docker

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: crypt0rr/artist-trackarr

jobs:
  test:
    name: Test Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Run image tests
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: test
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=artist-trackarr-test
          cache-to: type=gha,mode=max,scope=artist-trackarr-test

      - name: Build runtime image
        run: docker build --tag artist-trackarr:ci .

      - name: Smoke test startup, persistence, and graceful shutdown
        # SMOKE_EXPECTED_VERSION enables the script's version-identity check.
        # On a tag build take it from the tag, not from source: that is the
        # one place anything proves end to end that the image about to be
        # published reports the version it is published as.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            expected="$(sed -n 's/^const Current = "\(.*\)"$/\1/p' internal/version/version.go)"
          fi
          # An empty value switches the check back off silently, which is the
          # state this guard spent sixteen releases in. Fail instead.
          if [ -z "${expected}" ]; then
            echo "could not determine the expected version; refusing to skip the check" >&2
            exit 1
          fi
          echo "asserting container reports version ${expected}"
          SMOKE_EXPECTED_VERSION="${expected}" scripts/container-smoke.sh artist-trackarr:ci

  disaster-recovery:
    name: Disaster recovery rehearsal
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build disposable runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: artist-trackarr:disaster-recovery
          cache-from: type=gha,scope=artist-trackarr-disaster-recovery
          cache-to: type=gha,mode=max,scope=artist-trackarr-disaster-recovery

      - name: Run isolated backup and restore rehearsal
        env:
          ARTIST_TRACKARR_IMAGE: artist-trackarr:disaster-recovery
          CI_RUN_ID: ${{ github.run_id }}
        run: scripts/disaster-recovery-smoke.sh

  quality:
    name: Native race and vulnerability checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Keep CI on the same patched Go toolchain used by the Docker build
          # and the module language version.
          go-version: '1.27.1'
          cache: true

      - name: Run race detector
        # Serialize package execution and disable the test cache so the
        # resource-bounded signal is reproducible on the shared runner.
        # Via make so the timeout is not a third copy: this step had the same
        # 10m default that made a loaded local run fail where CI passed, and
        # a slow runner would have hit it here too - on a release build.
        run: make race

      - name: Report test coverage
        run: make coverage

      - name: Check formatting
        run: test -z "$(gofmt -l internal cmd)"

      - name: Check pinned tooling
        run: make tooling-check

      - name: Check release documentation
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/check-version-docs.sh "$GITHUB_REF_NAME"

      - name: Run lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  publish:
    name: Publish Docker image
    if: github.event_name == 'push'
    needs: [test, quality, disaster-recovery]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=ArtistTrackarr
            org.opencontainers.image.description=Self-hosted artist release tracker

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=artist-trackarr-runtime
          cache-to: type=gha,mode=max,scope=artist-trackarr-runtime
          provenance: mode=max
          sbom: true
