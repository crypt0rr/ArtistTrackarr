name: Docker

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: crypt0rr/artist-trackarr

jobs:
  test:
    name: Test Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Run image tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: test
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=artist-trackarr-test
          cache-to: type=gha,mode=max,scope=artist-trackarr-test

      - name: Build runtime image
        run: docker build --tag artist-trackarr:ci .

      - name: Resolve expected version identity
        id: expected-version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            expected="$(sed -n 's/^const Current = "\(.*\)"$/\1/p' internal/version/version.go)"
          fi
          # An empty value switches the check back off silently, which is the
          # state this guard spent sixteen releases in. Fail instead.
          if [ -z "${expected}" ]; then
            echo "could not determine the expected version; refusing to skip the check" >&2
            exit 1
          fi
          echo "version=${expected}" >> "$GITHUB_OUTPUT"
          echo "asserting container reports version ${expected}"

      - name: Smoke test amd64 startup, persistence, and graceful shutdown
        env:
          SMOKE_PLATFORM: linux/amd64
          SMOKE_EXPECTED_VERSION: ${{ steps.expected-version.outputs.version }}
          CI_RUN_ID: ${{ github.run_id }}
        run: scripts/container-smoke.sh artist-trackarr:ci

      - name: Build arm64 runtime image for pull request smoke coverage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: artist-trackarr:ci-arm64
          cache-from: type=gha,scope=artist-trackarr-runtime-arm64-smoke
          cache-to: type=gha,mode=max,scope=artist-trackarr-runtime-arm64-smoke

      - name: Smoke test arm64 startup, persistence, and graceful shutdown
        env:
          SMOKE_PLATFORM: linux/arm64
          SMOKE_EXPECTED_VERSION: ${{ steps.expected-version.outputs.version }}
          SMOKE_READY_TIMEOUT_SECONDS: 180
          CI_RUN_ID: ${{ github.run_id }}
        run: scripts/container-smoke.sh artist-trackarr:ci-arm64

  disaster-recovery:
    name: Disaster recovery rehearsal
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build disposable runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: artist-trackarr:disaster-recovery
          cache-from: type=gha,scope=artist-trackarr-disaster-recovery
          cache-to: type=gha,mode=max,scope=artist-trackarr-disaster-recovery

      - name: Run isolated backup and restore rehearsal
        env:
          ARTIST_TRACKARR_IMAGE: artist-trackarr:disaster-recovery
          CI_RUN_ID: ${{ github.run_id }}
        run: scripts/disaster-recovery-smoke.sh

  quality:
    name: Native race and vulnerability checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Keep CI on the same patched Go toolchain used by the Docker build
          # and the module language version.
          go-version: '1.27.2'
          cache: true

      - name: Run race detector
        # Serialize package execution and disable the test cache so the
        # resource-bounded signal is reproducible on the shared runner.
        # Via make so the timeout is not a third copy: this step had the same
        # 10m default that made a loaded local run fail where CI passed, and
        # a slow runner would have hit it here too - on a release build.
        run: make race

      - name: Report test coverage
        run: make coverage

      - name: Check formatting
        run: test -z "$(gofmt -l internal cmd)"

      - name: Check pinned tooling
        run: make tooling-check

      - name: Check release documentation
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/check-version-docs.sh "$GITHUB_REF_NAME"

      - name: Run lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  query-benchmark:
    name: Dashboard query baseline and candidate benchmark
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[query-benchmark]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.2'
          cache: true

      - name: Benchmark base and candidate on the same runner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GOMAXPROCS: "2"
          GOFLAGS: -buildvcs=false
        run: |
          git worktree add /tmp/query-baseline "$BASE_SHA"
          cp internal/store/ownership_benchmark_test.go /tmp/query-baseline/internal/store/
          echo "BASELINE $BASE_SHA"
          (cd /tmp/query-baseline && go test ./internal/store -run '^$' -bench '^BenchmarkDashboardReleases$' -benchmem -benchtime=3x -count=5)
          echo "CANDIDATE $GITHUB_SHA"
          go test ./internal/store -run '^$' -bench '^BenchmarkDashboardReleases$' -benchmem -benchtime=3x -count=5

  publish:
    name: Publish Docker image
    if: github.event_name == 'push'
    needs: [test, quality, disaster-recovery]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=ArtistTrackarr
            org.opencontainers.image.description=Self-hosted artist release tracker

      - name: Resolve expected version identity
        id: expected-version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            expected="$(sed -n 's/^const Current = \"\(.*\)\"$/\1/p' internal/version/version.go)"
          fi
          if [ -z "${expected}" ]; then
            echo "could not determine the expected version; refusing to skip the check" >&2
            exit 1
          fi
          echo "version=${expected}" >> "$GITHUB_OUTPUT"
          echo "asserting container reports version ${expected}"

      - name: Build multi-arch image by digest
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Publish only an immutable digest here. No mutable alias is moved
          # until both platform-specific smoke tests pass below.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=artist-trackarr-runtime
          cache-to: type=gha,mode=max,scope=artist-trackarr-runtime
          provenance: mode=max
          sbom: true

      - name: Resolve published platform digests
        id: platform-digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "build did not return an immutable image digest: ${IMAGE_DIGEST}" >&2
            exit 1
          fi
          manifest="$(docker buildx imagetools inspect --raw "${IMAGE}@${IMAGE_DIGEST}")"
          for arch in amd64 arm64; do
            digest="$(jq -er --arg arch "${arch}" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
              | if length == 1 then .[0] else error("expected exactly one linux/" + $arch + " manifest") end
            ' <<<"${manifest}")"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "invalid linux/${arch} manifest digest: ${digest}" >&2
              exit 1
            fi
            echo "${arch}_digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "linux/${arch} smoke target: ${IMAGE}@${digest}"
          done

      - name: Smoke-test published amd64 digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          PLATFORM_DIGEST: ${{ steps.platform-digests.outputs.amd64_digest }}
          SMOKE_PLATFORM: linux/amd64
          SMOKE_EXPECTED_VERSION: ${{ steps.expected-version.outputs.version }}
          SMOKE_READY_TIMEOUT_SECONDS: 180
          CI_RUN_ID: ${{ github.run_id }}
        run: scripts/container-smoke.sh "${IMAGE}@${PLATFORM_DIGEST}"

      - name: Smoke-test published arm64 digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          PLATFORM_DIGEST: ${{ steps.platform-digests.outputs.arm64_digest }}
          SMOKE_PLATFORM: linux/arm64
          SMOKE_EXPECTED_VERSION: ${{ steps.expected-version.outputs.version }}
          SMOKE_READY_TIMEOUT_SECONDS: 180
          CI_RUN_ID: ${{ github.run_id }}
        run: scripts/container-smoke.sh "${IMAGE}@${PLATFORM_DIGEST}"

      - name: Promote verified image digest to release tags
        if: success()
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE_TAGS}" ]]; then
            echo "metadata action produced no image tags; refusing to leave the build unpromoted" >&2
            exit 1
          fi
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            echo "promoting ${IMAGE}@${IMAGE_DIGEST} to ${tag}"
            # A single index source is copied byte-for-byte, retaining its
            # platform manifests, provenance, and SBOM attestations.
            docker buildx imagetools create --tag "${tag}" "${IMAGE}@${IMAGE_DIGEST}"
          done <<<"${IMAGE_TAGS}"

      - name: Verify published tags retain tested digests and attestations
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          AMD64_DIGEST: ${{ steps.platform-digests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.platform-digests.outputs.arm64_digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE_TAGS}" ]]; then
            echo "metadata action produced no image tags" >&2
            exit 1
          fi
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            actual_digest="$(docker buildx imagetools inspect "${tag}" --format '{{.Manifest.Digest}}')"
            if [ "${actual_digest}" != "${IMAGE_DIGEST}" ]; then
              echo "${tag} points to ${actual_digest}; expected tested index ${IMAGE_DIGEST}" >&2
              exit 1
            fi
            manifest="$(docker buildx imagetools inspect --raw "${tag}")"
            for pair in "amd64:${AMD64_DIGEST}" "arm64:${ARM64_DIGEST}"; do
              arch="${pair%%:*}"
              digest="${pair#*:}"
              jq -e --arg arch "${arch}" --arg digest "${digest}" '
                any(.manifests[]; .platform.os == "linux" and .platform.architecture == $arch and .digest == $digest)
              ' <<<"${manifest}" >/dev/null
              jq -e --arg digest "${digest}" '
                any(.manifests[]; .annotations["vnd.docker.reference.type"] == "attestation-manifest" and .annotations["vnd.docker.reference.digest"] == $digest)
              ' <<<"${manifest}" >/dev/null
            done
            docker buildx imagetools inspect "${tag}" --format '{{json .Provenance}}' \
              | jq -e 'has("linux/amd64") and has("linux/arm64") and .["linux/amd64"].SLSA != null and .["linux/arm64"].SLSA != null' >/dev/null
            docker buildx imagetools inspect "${tag}" --format '{{json .SBOM}}' \
              | jq -e '.["linux/amd64"].SPDX != null and .["linux/arm64"].SPDX != null' >/dev/null
            echo "verified ${tag} -> ${IMAGE_DIGEST} (amd64 ${AMD64_DIGEST}, arm64 ${ARM64_DIGEST}, provenance and SBOM present)"
          done <<<"${IMAGE_TAGS}"
